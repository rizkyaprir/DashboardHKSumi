*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.brand{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.logo{width:150px;border-radius:12px;background:#fff;padding:8px 10px;margin:0 auto 12px}.logo img{display:block;width:100%;height:auto}

.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-left:3px solid transparent;border-radius:10px;background:none;color:var(--mut);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.nav:hover{background:var(--hov);color:var(--tx)}
.nav.on{background:var(--hov);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.nav i{font-style:normal;font-size:18px;width:24px;text-align:center}
main{flex:1;min-width:0;padding:20px 24px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;flex:1}
.top small{color:var(--mut);display:block;font-weight:400;font-size:12px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer}
#menu{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:26px;margin-top:2px}.kpi em{font-style:normal;font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card h3{margin:0 0 12px;font-size:15px}
.row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.row b{text-align:right}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px;font-size:12px;color:var(--mut)}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.fl{display:flex;align-items:center;gap:10px;margin:7px 0}
.fl>b{width:44px;color:var(--mut);font-size:12px;flex:none}
.rooms{display:flex;flex-wrap:wrap;gap:5px}
.rm{width:44px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.note{color:var(--mut);font-size:12px;margin-top:16px}
@media(max-width:820px){
aside{position:fixed;z-index:20;left:0;top:0;bottom:0;height:auto;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
aside.open{transform:none}
#menu{display:block}main{padding:16px 14px 40px}
.row{grid-template-columns:90px 1fr 40px}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
